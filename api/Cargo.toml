[package]
name = "playthru-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
anyhow = "1"
argon2 = "0.6"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["typed-header"] }
base64 = "0.23.1"
dotenvy = "0.15.7"
getrandom = "0.4.3"
hmac = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "migrate", "macros", "uuid", "chrono", "json"] }
subtle = "2.6.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6", features = ["trace", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v7", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
