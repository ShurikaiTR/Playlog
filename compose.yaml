# Tüm sistem: web (SvelteKit) + api (Rust) + db (PostgreSQL 18).
# Yalnızca web dışarı açılır; api ve db yalnızca iç ağdadır.
# Sırlar .env dosyasından ya da panelden gelir (depoya yazılmaz).
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: playthru
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: playthru
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U playthru']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://playthru:${POSTGRES_PASSWORD}@db:5432/playthru
      BIND_ADDR: 0.0.0.0:8080
      CODE_SECRET: ${CODE_SECRET:?CODE_SECRET gerekli (en az 32 karakter)}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-Playthru <onboarding@resend.dev>}
      # OAuth callback adresi buradan kurulur: ${PUBLIC_URL}/auth/google/callback
      PUBLIC_URL: ${PUBLIC_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # Cloudflare Turnstile: sır yalnızca burada (api); boşsa doğrulama kapalıdır.
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      TURNSTILE_HOSTNAMES: ${TURNSTILE_HOSTNAMES:-}
      # Katalog içe aktarma betiğinin anahtarı; boşsa içe aktarma yalnızca admin oturumuyla yapılır.
      CATALOG_IMPORT_TOKEN: ${CATALOG_IMPORT_TOKEN:-}
      RUST_LOG: info

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      API_URL: http://api:8080
      # Cloudflare Tunnel arkasında (Cloudflare belgesi): X-Forwarded-Proto ziyaretçinin
      # kullandığı protokolü, CF-Connecting-IP gerçek ziyaretçi IP'sini taşır.
      # Bu başlıklara yalnızca web'e Cloudflare dışından erişilemiyorsa güvenilir
      # (port 127.0.0.1'e bağlı; dışarıdan sahte başlık gönderilemez).
      PROTOCOL_HEADER: x-forwarded-proto
      ADDRESS_HEADER: cf-connecting-ip
      # Turnstile site anahtarı herkese açıktır; widget boşsa gösterilmez.
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    ports:
      # Yalnızca aynı makinedeki vekil erişir; Docker yayımlanan portlarda güvenlik duvarını atlar.
      - '127.0.0.1:3000:3000'

  # Katalog verisi: Wikidata + Steam'den çeker ve API'ye yükler. `up` ile başlamaz; elle çalıştırılır:
  #   docker compose run --rm catalog fetch --limit 500 --out /data/catalog.json
  #   docker compose run --rm catalog push /data/catalog.json
  catalog:
    build: ./tools/catalog
    profiles: [tools]
    # Tek seferlik bir araçtır; işi bitince (ya da komutsuz başlatılınca) yeniden başlamaz.
    restart: 'no'
    depends_on:
      - api
    environment:
      API_URL: http://api:8080
      CATALOG_IMPORT_TOKEN: ${CATALOG_IMPORT_TOKEN:-}
    volumes:
      # Çıktı dosyası ve kaynak yanıtlarının önbelleği; yeniden çalıştırma kaynakları tekrar yormaz.
      - catalogdata:/data

volumes:
  pgdata:
  catalogdata:
